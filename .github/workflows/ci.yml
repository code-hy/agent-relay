name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.141.1" "uvicorn[standard]>=0.52.4" "sqlalchemy>=2.0.52" "psycopg[binary]>=3.3.5" "pydantic-settings>=2.15.0" "httpx>=0.28.1" "pytest>=9.1.1"
      - name: Run tests against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay
        run: |
          python -m pytest -q test_agent_relay.py test_integration_task_flow.py

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image with unique tag
        run: |
          TAG="${GITHUB_SHA:-local}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          docker build -t agent-relay:$TAG .
      - name: Load image into kind and roll out
        run: |
          kind load docker-image agent-relay:$TAG --name kind
          kubectl set image deployment/agent-relay api=agent-relay:$TAG
          kubectl rollout status deployment/agent-relay --timeout=180s
