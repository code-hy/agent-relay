apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  labels:
    app: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-relay
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: agent-relay
    spec:
      containers:
        - name: api
          image: agent-relay:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://relay:relay@postgres:5432/relay
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
